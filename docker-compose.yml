services:
  # The FastAPI application service
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./_temp:/app/_temp
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

